<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Inputs into grocery customer purchases</title>
<desc id="desc">Customer purchases, measured in dollars spent on this visit, form the central outcome. This stage shows 1 of four possible inputs with arrows pointing into purchases.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#526574"/></marker></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<line data-input="household-needs" x1="335.541" y1="193.482" x2="480.341" y2="251.804" stroke="#526574" stroke-width="4" marker-end="url(#arrow)"/>
<g id="outcome"><circle cx="600" cy="300" r="120" fill="#196B78" stroke="#125360" stroke-width="3"/><text x="600" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff"><tspan x="600">Customer</tspan><tspan x="600" dy="39">purchases</tspan></text><text x="600" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">$ spent on this visit</text></g>
<g id="household-needs"><circle cx="240" cy="155" r="100" fill="#EAF1F5" stroke="#526574" stroke-width="3"/><text x="240" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#253A48"><tspan x="240">Household</tspan><tspan x="240" dy="35">needs</tspan></text></g>
</svg>